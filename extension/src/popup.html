<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HonorMed · Registro rápido</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <img class="logo" src="logo-primary.png" alt="HonorMed" />
      <h1>Registro rápido</h1>
      <p class="intro">Seu controle pessoal, sem dados de pacientes.</p>
      <div id="status" role="status">Verificando sua sessão…</div>
      <section id="login" hidden>
        <form id="login-form">
          <label>E-mail <input id="email" type="email" autocomplete="email" required /></label>
          <label>Senha <input id="password" type="password" autocomplete="current-password" required /></label>
          <label class="remember"><input id="remember" type="checkbox" /> Manter conectado neste computador</label>
          <p class="hint">Use apenas em computador de uso exclusivo seu. Sai após 12 h sem uso.</p>
          <button id="enter" type="submit">Entrar</button>
        </form>
        <div class="links">
          <button id="forgot" type="button" class="link">Esqueci a senha</button>
          <button id="signup" type="button" class="link">Criar conta</button>
        </div>
      </section>
      <section id="connected" hidden>
        <p>Conta conectada. Abra o HonorMed para registrar sua produção.</p>
        <div class="actions">
          <button id="open-app" type="button">Abrir HonorMed</button>
          <button id="logout" type="button" class="secondary">Sair</button>
        </div>
      </section>
      <p id="error" role="alert" hidden></p>
      <footer>Informado por você · sem confirmação hospitalar.</footer>
    </main>
  </body>
</html>
