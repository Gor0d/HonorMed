name: Validate HonorMed
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test ${{ startsWith(github.head_ref || github.ref_name, 'feat/b') && '-- tests/b' || '' }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e ${{ startsWith(github.head_ref || github.ref_name, 'feat/b') && '-- b[1-6]-' || '' }}
  extension:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'feat/b') || startsWith(github.head_ref || github.ref_name, 'feat/b3-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e ${{ startsWith(github.head_ref || github.ref_name, 'feat/b3-') && '-- b3-feedback.spec.ts' || '' }}
      - run: npm run check:artifacts
